name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "types/**"
      - "public/**"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "Dockerfile"
      - "worker/**"
      - "nomad/**"
      - ".github/workflows/ci.yml"

env:
  VERSION: "1.0.0"
  ENVIRONMENT: "prod"
  HARBOR_REGISTRY: h4rb0r.acm.acumen-strategy.com

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Push — ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: ./Dockerfile
            image: h4rb0r.acm.acumen-strategy.com/linkedin-outreach/frontend
          - name: worker
            context: ./worker
            dockerfile: ./worker/Dockerfile
            image: h4rb0r.acm.acumen-strategy.com/linkedin-outreach/worker
    outputs:
      IMAGE_TAG: ${{ steps.export_tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate IMAGE_TAG
        id: export_tag
        run: |
          IMAGE_TAG="${{ env.ENVIRONMENT }}-v${{ env.VERSION }}-${GITHUB_SHA:0:8}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Nomad
    runs-on: self-hosted
    needs: build
    env:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main
        with:
          version: latest

      - name: Update Nomad job image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" nomad/linkedin-console.hcl

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          nomad job run nomad/linkedin-console.hcl

  notify:
    name: Notify Teams
    needs: [build, deploy]
    if: always()
    uses: Acumen-org/deploy-notify/.github/workflows/notify.yml@main
    with:
      app_name: "LinkedIn Console"
      environment: "prod"
      status: ${{ needs.deploy.result }}
      version: ${{ needs.build.outputs.IMAGE_TAG }}
      actor: ${{ github.actor }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
